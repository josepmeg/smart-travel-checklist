<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Travel Checklist V10</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="text-primary transition-colors duration-500">
<div class="container mx-auto max-w-7xl p-4 sm:p-6 md:p-8">

    <!-- Header -->
    <header class="text-center mb-6">
        <div class="flex items-center justify-between mb-2">
            <button id="dark-mode-toggle" class="text-2xl p-2 rounded-lg hover:bg-white/20 transition-colors" title="Toggle dark mode">🌙</button>
            <h1 class="text-3xl sm:text-4xl font-bold text-primary drop-shadow-sm flex items-center justify-center">
                <i data-lucide="briefcase" class="w-8 h-8 sm:w-10 sm:h-10 mr-3"></i>
                Smart Travel Checklist
            </h1>
            <button id="reset-btn" class="text-sm px-3 py-1.5 border border-theme rounded-lg text-secondary hover:text-primary hover:bg-white/20 transition-colors" title="Reset all">
                <i data-lucide="rotate-ccw" class="w-4 h-4 inline"></i> Reset
            </button>
        </div>
        <p class="text-base text-primary/80">Your personalized packing assistant</p>
    </header>

    <!-- Saved Trips Bar -->
    <div class="bg-card p-4 rounded-xl shadow-md mb-4 border border-theme flex flex-wrap items-center gap-3">
        <span class="text-sm font-medium text-secondary flex items-center gap-1"><i data-lucide="bookmark" class="w-4 h-4"></i>Trips:</span>
        <select id="load-trip-select" class="text-sm p-1.5 border border-theme rounded-lg bg-transparent text-primary flex-grow max-w-xs">
            <option value="">Load a saved trip...</option>
        </select>
        <button id="save-trip-btn" class="text-sm px-3 py-1.5 border border-theme rounded-lg text-secondary hover:text-primary hover:bg-white/20 transition-colors flex items-center gap-1">
            <i data-lucide="save" class="w-4 h-4"></i> Save Current
        </button>
        <button id="delete-trip-btn" class="text-sm px-3 py-1.5 border border-red-300 rounded-lg text-red-600 hover:bg-red-50 transition-colors flex items-center gap-1" style="display:none;">
            <i data-lucide="trash-2" class="w-4 h-4"></i> Delete
        </button>
    </div>

    <!-- Controls Panel -->
    <div class="bg-card p-6 rounded-2xl shadow-lg mb-6 border border-theme">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <div>
                <h3 class="font-semibold text-secondary mb-3 flex items-center"><i data-lucide="map" class="w-5 h-5"></i>Trip Type</h3>
                <div id="trip-type-controls" class="flex flex-wrap gap-2"></div>
            </div>
            <div>
                <h3 class="font-semibold text-secondary mb-3 flex items-center"><i data-lucide="cloud-sun" class="w-5 h-5"></i>Season</h3>
                <div id="season-controls" class="flex flex-wrap gap-2"></div>
            </div>
            <div>
                <h3 class="font-semibold text-secondary mb-3 flex items-center"><i data-lucide="calendar-days" class="w-5 h-5"></i>Dates</h3>
                <div class="flex flex-col gap-2">
                    <input type="date" id="start-date-input" class="p-2 border border-theme rounded-lg focus:ring-2 ring-accent-primary bg-transparent text-primary">
                    <input type="date" id="end-date-input" class="p-2 border border-theme rounded-lg focus:ring-2 ring-accent-primary bg-transparent text-primary">
                    <p class="text-sm text-secondary text-center">Duration: <span id="duration-display">0</span> days</p>
                </div>
            </div>
            <div>
                <h3 class="font-semibold text-secondary mb-3 flex items-center"><i data-lucide="plane" class="w-5 h-5"></i>Flight & Options</h3>
                <div class="flex flex-col gap-2">
                    <input type="text" id="destination-input" placeholder="e.g., Japan" class="p-2 border border-theme rounded-lg focus:ring-2 ring-accent-primary bg-transparent text-primary placeholder:text-secondary">
                    <div class="flex items-center gap-1">
                        <input type="text" id="flight-number-input" placeholder="Flight # (e.g., IB3214)" class="p-2 border border-theme rounded-lg focus:ring-2 ring-accent-primary bg-transparent text-primary placeholder:text-secondary flex-grow text-sm">
                        <button id="check-flight-btn" class="p-2 border border-theme rounded-lg text-secondary hover:text-primary hover:bg-white/20 transition-colors flex-shrink-0" title="Check flight on Google">
                            <i data-lucide="external-link" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <div class="flex flex-col gap-1.5 mt-1">
                        <label class="flex items-center gap-2 text-sm text-secondary cursor-pointer">
                            <input type="checkbox" id="long-flight-checkbox" class="h-4 w-4 rounded border-theme text-accent-primary ring-accent-primary bg-transparent">
                            Long Flight (>3h)
                        </label>
                        <label class="flex items-center gap-2 text-sm text-secondary cursor-pointer">
                            <input type="checkbox" id="laundry-checkbox" class="h-4 w-4 rounded border-theme text-accent-primary ring-accent-primary bg-transparent">
                            Laundry available
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Legend -->
    <div class="flex flex-wrap items-center gap-4 mb-4 px-2 text-xs text-secondary">
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-sm bg-blue-100 border-l-2 border-blue-600 inline-block"></span> Crucial</span>
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-sm bg-gray-100 inline-block opacity-50"></span> Muted (not matching filters)</span>
        <span class="flex items-center gap-1">📍 Unassigned</span>
        <span class="flex items-center gap-1">🧳 Carry-on</span>
        <span class="flex items-center gap-1">📦 Checked</span>
        <span class="flex items-center gap-1">🎒 Personal</span>
    </div>

    <!-- Progress Bar -->
    <div class="mb-6 px-2">
        <h3 class="font-semibold text-lg text-secondary mb-2">Packing Progress</h3>
        <div class="w-full bg-card rounded-full h-4 border border-theme">
            <div id="progress-bar" class="accent-primary-bg h-full rounded-full text-xs font-medium text-center p-0.5 leading-none transition-all duration-500" style="width: 0%">0%</div>
        </div>
    </div>

    <!-- Checklist Grid -->
    <div class="flex justify-end mb-3 px-2">
        <button id="toggle-all-btn" class="text-sm px-3 py-1.5 border border-theme rounded-lg text-secondary hover:text-primary hover:bg-white/20 transition-colors flex items-center gap-1">
            <i data-lucide="rows-3" class="w-4 h-4"></i> Expand all
        </button>
    </div>
    <div id="checklist-container" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"></div>

</div>
<script src="js/main.js"></script>
</body>
</html>
